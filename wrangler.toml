name = "userflex-admin"
main = "cloudflare/worker.ts"
compatibility_date = "2026-09-10"
workers_dev = true
preview_urls = false

[triggers]
crons = ["0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[observability]
enabled = true

[[r2_buckets]]
binding = "CLIENT_RELEASES"
bucket_name = "userflex-client-releases"

[[r2_buckets]]
binding = "PROFILE_IMAGES"
bucket_name = "userflex-profile-images"

[vars]
CREATORTOOLS_AUTH_ORIGIN = "https://creatortools-reconstruction-lab.luis5afp.workers.dev"
USERFLEX_PROXY_KEY_VERSION = "v1"
