<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CourseHub Admin Console</title>
    <meta name="description" content="Consola administrativa exclusiva y servidor API adjunto con soporte para cliente de escritorio PC (instalador), validación por código de 6 dígitos, particiones y cookies aisladas por curso/perfil, y compatibilidad con Cloudflare D1/Workers." />
    <meta property="og:title" content="CourseHub Admin Console" />
    <meta property="og:description" content="Consola administrativa exclusiva y servidor API adjunto con soporte para cliente de escritorio PC (instalador), validación por código de 6 dígitos, particiones y cookies aisladas por curso/perfil, y compatibilidad con Cloudflare D1/Workers." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CourseHub VIP" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.log('SW registration skipped:', err);
          });
        });
      }
    </script>
  </head>
  <body style="margin:0; background-color:#0f172a; color:#f8fafc;">
    <div id="root">
      <div style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0f172a; color:#94a3b8; font-family:system-ui,-apple-system,sans-serif;">
        <div style="width:48px; height:48px; border-radius:12px; background:#4f46e5; display:flex; align-items:center; justify-content:center; margin-bottom:16px; font-weight:900; font-size:24px; color:#ffffff; box-shadow:0 10px 25px -5px rgba(79,70,229,0.5);">VIP</div>
        <div style="font-size:18px; font-weight:bold; color:#f8fafc; margin-bottom:6px;">CourseHub VIP Desktop</div>
        <div style="font-size:13px; color:#64748b;">Iniciando entorno de escritorio seguro...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
