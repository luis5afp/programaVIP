name: Fix userFLOW v0.2.29 Google profile tab patch

on:
  push:
    branches: [feature/google-profile-tabs-v029]
    paths:
      - 'scripts/fix-google-profile-tabs-v029.mjs'
      - '.github/workflows/fix-google-profile-tabs-v029.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/google-profile-tabs-v029
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fix
        run: node scripts/fix-google-profile-tabs-v029.mjs
      - name: Remove temporary helpers
        run: |
          rm -f scripts/fix-google-profile-tabs-v029.mjs
          rm -f .github/workflows/fix-google-profile-tabs-v029.yml
      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Google tab permission delivery v0.2.29"
          git push origin HEAD:feature/google-profile-tabs-v029
