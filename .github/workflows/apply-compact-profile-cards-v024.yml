name: Apply compact profile cards v0.2.24

on:
  push:
    branches:
      - feature/compact-profile-cards-v024

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply compact catalog changes
        run: node scripts/apply-compact-profile-cards-v024.mjs
      - name: Remove temporary migration helpers
        run: |
          rm scripts/apply-compact-profile-cards-v024.mjs
          rm .github/workflows/apply-compact-profile-cards-v024.yml
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compact profile catalog cards v0.2.24"
          git push origin HEAD:feature/compact-profile-cards-v024
