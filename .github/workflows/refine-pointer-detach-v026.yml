name: Refine pointer detach v0.2.26

on:
  push:
    branches:
      - fix/pointer-tab-drag-v026
    paths:
      - .github/workflows/refine-pointer-detach-v026.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pointer-tab-drag-v026
          fetch-depth: 0
      - name: Refine detach threshold
        shell: python
        run: |
          from pathlib import Path
          path = Path('client-app/main.js')
          text = path.read_text(encoding='utf-8')
          old = '''    const cursor = screen.getCursorScreenPoint();
              const bounds = browserWindow.getBounds();
              const margin = 18;
              const outside = cursor.x < bounds.x - margin
                || cursor.x > bounds.x + bounds.width + margin
                || cursor.y < bounds.y - margin
                || cursor.y > bounds.y + bounds.height + margin;
              if (!outside) return;
              stopProfileDragMonitor();
              detachProfile(profileId, cursor);'''
          new = '''    const cursor = screen.getCursorScreenPoint();
              const bounds = browserWindow.getBounds();
              const windowMargin = 18;
              const tabDetachDistance = 34;
              const outsideWindow = cursor.x < bounds.x - windowMargin
                || cursor.x > bounds.x + bounds.width + windowMargin
                || cursor.y < bounds.y - windowMargin
                || cursor.y > bounds.y + bounds.height + windowMargin;
              const leftTabStrip = cursor.y > bounds.y + TAB_STRIP_HEIGHT + tabDetachDistance;
              if (!outsideWindow && !leftTabStrip) return;
              stopProfileDragMonitor();
              detachProfile(profileId, cursor);'''
          if old not in text:
              raise SystemExit('Expected drag monitor fragment not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/refine-pointer-detach-v026.yml').unlink()
      - name: Validate JavaScript syntax
        run: node --check client-app/main.js
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client-app/main.js .github/workflows/refine-pointer-detach-v026.yml
          git commit -m "Detach profile when dragged away from tab strip"
          git push origin HEAD:fix/pointer-tab-drag-v026
