name: Apply client device limits and plan periods

on:
  push:
    branches:
      - feature/client-device-limit-plan-periods
    paths:
      - scripts/apply-client-device-periods.mjs
      - .github/workflows/apply-client-device-periods.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/client-device-limit-plan-periods
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: node scripts/apply-client-device-periods.mjs
      - name: Remove temporary helpers
        run: |
          rm scripts/apply-client-device-periods.mjs
          rm .github/workflows/apply-client-device-periods.yml
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move device limits to clients and add plan periods"
          git push origin HEAD:feature/client-device-limit-plan-periods
