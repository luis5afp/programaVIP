name: Apply profile usage history v0.2.30

on:
  push:
    branches:
      - feature/profile-usage-history-v0230
    paths:
      - scripts/apply-profile-usage-history-v0230.mjs
      - .github/workflows/apply-profile-usage-history-v0230.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/profile-usage-history-v0230
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/apply-profile-usage-history-v0230.mjs
      - name: Validate client JavaScript
        run: node --check client-app/main.js
      - name: Remove temporary helpers
        run: rm -f scripts/apply-profile-usage-history-v0230.mjs .github/workflows/apply-profile-usage-history-v0230.yml
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add profile usage history v0.2.30"
          git push origin HEAD:feature/profile-usage-history-v0230
