name: Apply device IP and search patch

on:
  push:
    branches:
      - feature/device-ip-search
    paths:
      - scripts/apply-device-ip-search.mjs
      - .github/workflows/apply-device-ip-search.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/device-ip-search
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/apply-device-ip-search.mjs
      - name: Remove temporary helpers
        run: rm -f scripts/apply-device-ip-search.mjs .github/workflows/apply-device-ip-search.yml
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add device IP visibility and search" || exit 0
          git push origin HEAD:feature/device-ip-search
