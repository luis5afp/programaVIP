name: Deploy userFLEX Admin to Cloudflare

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["userFLEX Admin CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: userflex-admin-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      USERFLEX_PROXY_MASTER_KEY: ${{ secrets.USERFLEX_PROXY_MASTER_KEY }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID USERFLEX_PROXY_MASTER_KEY NEON_DATABASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Ensure Cloudflare R2 updater bucket
        shell: bash
        run: npx wrangler@4.130.0 r2 bucket create userflex-client-releases || true

      - name: Ensure Cloudflare R2 profile image bucket
        shell: bash
        run: npx wrangler@4.130.0 r2 bucket create userflex-profile-images || true

      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build

      - name: Validate desktop release prerequisites
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_USERFLOW="$(node -p "require('./client-app/package.json').version")"
          MIN_SESSION_MANAGER="$(node --experimental-strip-types -e "import('./cloudflare/lib/release-compat.ts').then(m=>process.stdout.write(m.MIN_SESSION_MANAGER_VERSION))")"
          echo "Validating published desktop releases: userFLOW v$EXPECTED_USERFLOW · Session Manager >= v$MIN_SESSION_MANAGER..."

          client_code="$(curl --silent --output /tmp/client-release.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${{ github.token }}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/client-v$EXPECTED_USERFLOW")"
          sm_code="$(curl --silent --output /tmp/sm-release.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${{ github.token }}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/session-manager-v$MIN_SESSION_MANAGER")"

          if [ "$client_code" != "200" ] || [ "$sm_code" != "200" ]; then
            echo "Required desktop release is missing. userFLOW-http=$client_code session-manager-http=$sm_code" >&2
            exit 1
          fi
          echo "Desktop release prerequisites are published."

      - name: Configure proxy encryption secret
        shell: bash
        run: printf '%s' "$USERFLEX_PROXY_MASTER_KEY" | npx wrangler@4.130.0 secret put USERFLEX_PROXY_MASTER_KEY

      - name: Configure Neon database secret
        shell: bash
        run: printf '%s' "$NEON_DATABASE_URL" | npx wrangler@4.130.0 secret put NEON_DATABASE_URL

      - name: Deploy Worker and static assets
        run: npx wrangler@4.130.0 deploy

      - name: Production smoke tests
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://userflex-admin.luis5afp.workers.dev"
          TOKEN="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          EXPECTED_USERFLOW="$(node -p "require('./client-app/package.json').version")"
          MIN_SESSION_MANAGER="$(node --experimental-strip-types -e "import('./cloudflare/lib/release-compat.ts').then(m=>process.stdout.write(m.MIN_SESSION_MANAGER_VERSION))")"

          ready=0
          for attempt in $(seq 1 30); do
            health="$(curl --silent --show-error --max-time 15 --header 'Cache-Control: no-cache' "$BASE/api/health" || true)"
            echo "health=$health"
            if HEALTH="$health" EXPECTED_USERFLOW="$EXPECTED_USERFLOW" MIN_SESSION_MANAGER="$MIN_SESSION_MANAGER" node - <<'NODE'
          const value = JSON.parse(process.env.HEALTH || '{}');
          if (value.ok !== true) process.exit(1);
          if (value.updateStorage !== 'cloudflare-r2') process.exit(1);
          if (value.profileImageStorage !== 'cloudflare-r2') process.exit(1);
          if (value.minimumClientVersion !== process.env.EXPECTED_USERFLOW) process.exit(1);
          if (value.minimumSessionManagerVersion !== process.env.MIN_SESSION_MANAGER) process.exit(1);
          NODE
            then
              ready=1
              echo "Production Worker is active with userFLOW >= v$EXPECTED_USERFLOW and Session Manager >= v$MIN_SESSION_MANAGER after propagation attempt $attempt."
              break
            fi
            echo "Waiting for Cloudflare propagation ($attempt/30)..."
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "Production Worker did not expose expected desktop compatibility after propagation window." >&2
            exit 1
          fi

          latest="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 --header 'Cache-Control: no-cache' "$BASE/api/client-update/latest")"
          LATEST="$latest" node - <<'NODE'
          const value = JSON.parse(process.env.LATEST || '{}');
          if (!/^\d+\.\d+\.\d+/.test(String(value.version || ''))) throw new Error('invalid updater version');
          if (!/^[0-9a-f]{64}$/i.test(String(value.sha256 || ''))) throw new Error('invalid updater sha256');
          if (!Array.isArray(value.chunks) || value.chunks.length < 1) throw new Error('updater has no chunks');
          NODE

          update_version="$(LATEST="$latest" node -e "const v=JSON.parse(process.env.LATEST||'{}'); process.stdout.write(String(v.version||''))")"
          first_chunk_name="$(LATEST="$latest" node -e "const v=JSON.parse(process.env.LATEST||'{}'); process.stdout.write(String(v.chunks?.[0]?.name||''))")"
          first_chunk_size="$(LATEST="$latest" node -e "const v=JSON.parse(process.env.LATEST||'{}'); process.stdout.write(String(v.chunks?.[0]?.size||''))")"
          first_chunk_file="$(basename "$first_chunk_name")"
          test -n "$update_version"
          test -n "$first_chunk_file"
          test -n "$first_chunk_size"

          curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 90 \
            --header 'Cache-Control: no-cache' \
            "$BASE/api/client-update/chunks/$update_version/$first_chunk_file" \
            --output /tmp/userflow-first-update-chunk.bin

          actual_chunk_size="$(stat -c%s /tmp/userflow-first-update-chunk.bin)"
          if [ "$actual_chunk_size" != "$first_chunk_size" ]; then
            echo "Updater first chunk size mismatch: expected=$first_chunk_size actual=$actual_chunk_size" >&2
            exit 1
          fi
          echo "Updater first chunk reachable: $first_chunk_file ($actual_chunk_size bytes)"

          code="$(curl --silent --output /tmp/catalog.json --write-out '%{http_code}' "$BASE/api/client/catalog")"
          test "$code" = "401"

          code="$(curl --silent --output /tmp/sm.json --write-out '%{http_code}' \
            --request POST "$BASE/api/session-manager/bootstrap" \
            --header 'content-type: application/json' \
            --header "X-Userflex-Session-Manager-Version: $MIN_SESSION_MANAGER" \
            --data "{\"token\":\"$TOKEN\"}")"
          test "$code" = "401"

          code="$(curl --silent --output /tmp/test.json --write-out '%{http_code}' \
            --request POST "$BASE/api/client-test/bootstrap" \
            --header 'content-type: application/json' \
            --header "X-Userflow-Client-Version: $EXPECTED_USERFLOW" \
            --data "{\"token\":\"$TOKEN\"}")"
          test "$code" = "401"
