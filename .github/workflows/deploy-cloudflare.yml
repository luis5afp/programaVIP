name: Deploy userFLEX Admin to Cloudflare

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["userFLEX Admin CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: userflex-admin-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      USERFLEX_PROXY_MASTER_KEY: ${{ secrets.USERFLEX_PROXY_MASTER_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_SERVICE_ROLE_KEY USERFLEX_PROXY_MASTER_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: ${name}" >&2
              exit 1
            fi
          done

      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build

      - name: Wait for paired desktop release
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(node -p "require('./client-app/package.json').version")"
          BASE="https://userflex-admin.luis5afp.workers.dev"
          echo "Waiting for userFLOW/Session Manager v$EXPECTED before server activation..."

          for attempt in $(seq 1 90); do
            current="$(curl --silent --show-error "$BASE/api/client-update/latest" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version||'')}catch{console.log('')}})")"
            sm_code="$(curl --silent --output /tmp/sm-release.json --write-out '%{http_code}' \
              --header "Authorization: Bearer ${{ github.token }}" \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/session-manager-v$EXPECTED")"
            if [ "$current" = "$EXPECTED" ] && [ "$sm_code" = "200" ]; then
              echo "Paired desktop release v$EXPECTED is ready."
              break
            fi
            if [ "$attempt" = "90" ]; then
              echo "Timed out waiting for paired desktop release. updater=$current session-manager-http=$sm_code" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Configure Supabase service secret
        shell: bash
        run: printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler@4.130.0 secret put SUPABASE_SERVICE_ROLE_KEY

      - name: Configure proxy encryption secret
        shell: bash
        run: printf '%s' "$USERFLEX_PROXY_MASTER_KEY" | npx wrangler@4.130.0 secret put USERFLEX_PROXY_MASTER_KEY

      - name: Deploy Worker and static assets
        run: npx wrangler@4.130.0 deploy

      - name: Production smoke tests
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://userflex-admin.luis5afp.workers.dev"
          TOKEN="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          EXPECTED="$(node -p "require('./client-app/package.json').version")"

          health="$(curl --fail --silent --show-error "$BASE/api/health")"
          HEALTH="$health" EXPECTED="$EXPECTED" node - <<'NODE'
          const value = JSON.parse(process.env.HEALTH || '{}');
          const expected = process.env.EXPECTED;
          if (value.ok !== true) throw new Error('health endpoint is not OK');
          if (value.minimumClientVersion !== expected) throw new Error('unexpected minimum client version');
          if (value.minimumSessionManagerVersion !== expected) throw new Error('unexpected minimum Session Manager version');
          NODE

          latest="$(curl --fail --silent --show-error "$BASE/api/client-update/latest")"
          LATEST="$latest" node - <<'NODE'
          const value = JSON.parse(process.env.LATEST || '{}');
          if (!/^\d+\.\d+\.\d+/.test(String(value.version || ''))) throw new Error('invalid updater version');
          if (!/^[0-9a-f]{64}$/i.test(String(value.sha256 || ''))) throw new Error('invalid updater sha256');
          if (!Array.isArray(value.chunks) || value.chunks.length < 1) throw new Error('updater has no chunks');
          NODE

          code="$(curl --silent --output /tmp/catalog.json --write-out '%{http_code}' "$BASE/api/client/catalog")"
          test "$code" = "401"

          code="$(curl --silent --output /tmp/sm.json --write-out '%{http_code}' \
            --request POST "$BASE/api/session-manager/bootstrap" \
            --header 'content-type: application/json' \
            --header "X-Userflex-Session-Manager-Version: $EXPECTED" \
            --data "{\"token\":\"$TOKEN\"}")"
          test "$code" = "401"

          code="$(curl --silent --output /tmp/test.json --write-out '%{http_code}' \
            --request POST "$BASE/api/client-test/bootstrap" \
            --header 'content-type: application/json' \
            --header "X-Userflow-Client-Version: $EXPECTED" \
            --data "{\"token\":\"$TOKEN\"}")"
          test "$code" = "401"
