name: Diagnose one userFLEX client creation request

on:
  push:
    branches:
      - 'diagnose/client-create-request-67faf2e9'

permissions:
  contents: read

jobs:
  inspect:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Find a specific Worker exception in Cloudflare Observability
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error, time
          req_id = "67faf2e9-fa07-429c-bc02-3b0b947d0d80"
          token=os.environ.get("CLOUDFLARE_API_TOKEN", "")
          account=os.environ.get("CLOUDFLARE_ACCOUNT_ID","")
          if not token or not account:
              print("DIAG_RESULT missing Cloudflare secrets"); exit(0)
          end=int(time.time()*1000)
          payload={
            "queryId": "userflex-client-create-diagnostic",
            "timeframe":{"from":end-24*3600*1000,"to":end},
            "view":"events",
            "limit":100,
            "parameters":{
              "datasets":["cloudflare-workers"],
              "filters":[{"key":"$metadata.message","operation":"includes","type":"string","value":req_id}],
              "limit":100
            }
          }
          url=f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/observability/telemetry/query"
          request=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"},method="POST")
          try:
              with urllib.request.urlopen(request,timeout=30) as response:
                  result=json.load(response)
          except urllib.error.HTTPError as error:
              data=error.read(2000)
              try:
                  detail=json.loads(data)
                  messages=[str(e.get("message",""))[:160] for e in detail.get("errors",[])][:2]
              except Exception:
                  messages=[]
              print("DIAG_RESULT API_HTTP", error.code, messages); exit(0)
          except Exception as error:
              print("DIAG_RESULT NETWORK",type(error).__name__);exit(0)
          if not result.get("success"):
              print("DIAG_RESULT API_ERRORS",[str(e.get("message",""))[:160] for e in result.get("errors",[])][:2]);exit(0)
          events=result.get("result",{}).get("events",[])
          if isinstance(events,dict): events=list(events.values())
          print("DIAG_RESULT matching_events",len(events))
          for item in events[:6]:
              source=item.get("source",{}) if isinstance(item,dict) else {}
              meta=item.get("$metadata",{}) if isinstance(item,dict) else {}
              parts=[]
              for value in (source,meta):
                  if isinstance(value,str): parts.append(value)
                  elif isinstance(value,dict):
                      for field in ["message","error","stack","text"]:
                          if isinstance(value.get(field),str):parts.append(value[field])
              message=" ".join(parts)
              if not message:
                  message=json.dumps(item,ensure_ascii=False)[:350]
              message=re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', '[EMAIL]',message)
              message=re.sub(r'(postgres(?:ql)?://)[^\s\"]+',r'\1[REDACTED]',message,flags=re.I)
              message=re.sub(r'(Bearer\s+)[A-Za-z0-9._-]+',r'\1[REDACTED]',message,flags=re.I)
              message=re.sub(r'(?i)(password|token|secret)(\s*[=:]\s*)([^\s,}]+)',r'\1\2[REDACTED]',message)
              print("DIAG_EVENT",message[:550])
          PY
