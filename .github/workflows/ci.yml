name: userFLEX Admin CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - name: Test profile runtime matrix
        run: node --experimental-strip-types scripts/profile-runtime-matrix.test.ts
      - name: Test release compatibility
        run: node --experimental-strip-types scripts/release-hardening.test.ts
      - run: npm run typecheck
      - run: npm run build
      - run: npx wrangler@4.130.0 deploy --dry-run
