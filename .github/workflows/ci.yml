name: userFLEX Admin CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - name: Test profile runtime matrix
        run: node --experimental-strip-types scripts/profile-runtime-matrix.test.ts
      - name: Test release compatibility
        run: node --experimental-strip-types scripts/release-hardening.test.ts
      - name: Test reliability hardening
        run: node --experimental-strip-types scripts/reliability-hardening.test.ts
      - name: Test password security
        run: node --experimental-strip-types scripts/password-security.test.ts
      - name: Test captured session validation
        run: node --experimental-strip-types scripts/captured-session-validation.test.ts
      - name: Test JSON cookie import
        run: node --experimental-strip-types scripts/cookie-import.test.ts
      - name: Test client login lifecycle
        run: node --experimental-strip-types scripts/client-login-lifecycle.test.ts
      - name: Test automatic updater installation
        run: node --experimental-strip-types scripts/automatic-updater-install.test.ts
      - name: Test reliable updater flow
        run: node --experimental-strip-types scripts/reliable-updater.test.ts
      - name: Test event-driven client heartbeat
        run: node --experimental-strip-types scripts/event-driven-heartbeat.test.ts
      - name: Test managed session health recovery
        run: node --experimental-strip-types scripts/session-health-recovery.test.ts
      - name: Test Session Keeper architecture
        run: node --experimental-strip-types scripts/session-keeper.test.ts
      - name: Test session validity and Admin alerts
        run: node --experimental-strip-types scripts/session-validity-alerts.test.ts
      - name: Test Keeper event triggers
        run: node --experimental-strip-types scripts/keeper-event-triggers.test.ts
      - name: Test legacy updater compatibility
        run: node --experimental-strip-types scripts/legacy-updater-compat.test.ts
      - name: Test managed browser launch and autofill
        run: node --experimental-strip-types scripts/browser-launch-regression.test.ts
      - name: Test Google auth redirect autofill
        run: node --experimental-strip-types scripts/google-autofill-policy.test.ts
      - name: Test Google profile configuration safeguards
        run: node --experimental-strip-types scripts/google-profile-configuration.test.ts
      - name: Test Google proxy HTTPS handshake
        run: node --experimental-strip-types scripts/google-proxy-handshake.test.ts
      - name: Test regional Google Accounts redirects
        run: node --experimental-strip-types scripts/google-regional-auth.test.ts
      - name: Test Google Accounts SOCKS DNS fallback
        run: node --experimental-strip-types scripts/google-socks-dns-fallback.test.ts
      - name: Test capture CDP autofill fallback
        run: node --experimental-strip-types scripts/capture-cdp-autofill.test.ts
      - name: Test ChatGPT auth recovery
        run: node --experimental-strip-types scripts/chatgpt-auth-flow.test.ts
      - name: Test capture retry token lifecycle
        run: node --experimental-strip-types scripts/capture-retry-regression.test.ts
      - name: Test automatic session save
        run: node --experimental-strip-types scripts/admin-save-session.test.ts
      - name: Test live proxy validation before capture
        run: node --experimental-strip-types scripts/capture-proxy-live-validation.test.ts
      - name: Test Session Manager single-tab launch
        run: node --experimental-strip-types scripts/session-manager-single-tab.test.ts
      - run: npm run typecheck
      - run: npm run build
      - run: npx wrangler@4.130.0 deploy --dry-run
