name: Build userFLEX Client

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'client-app/**'
      - '.github/workflows/build-client-app.yml'
      - 'supabase/migrations/*client_release*'
  push:
    branches: [main]
    paths:
      - 'client-app/**'
      - '.github/workflows/build-client-app.yml'
      - 'supabase/migrations/*client_release*'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    environment: production
    defaults:
      run:
        working-directory: client-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Client dependencies
        run: npm install

      - name: Validate Client JavaScript
        shell: pwsh
        run: |
          node --check bootstrap.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check main.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check renderer.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check preload.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows installer
        run: npm run dist:win

      - name: Build chunked updater feed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $exe = Get-ChildItem -Path dist -Filter *.exe | Where-Object { $_.Name -notlike '*.__uninstaller.exe' } | Select-Object -First 1
          if (-not $exe) { throw "No Windows installer was generated." }
          if ($exe.Length -gt 300MB) { throw "Client installer exceeds the supported updater size." }

          $feedRoot = Join-Path $PWD 'dist\update-feed'
          $versionRoot = Join-Path $feedRoot "versions\$version"
          New-Item -ItemType Directory -Path $versionRoot -Force | Out-Null

          $chunkSize = 20MB
          $chunks = @()
          [int64]$totalChunkBytes = 0
          $input = [System.IO.File]::OpenRead($exe.FullName)
          try {
            $index = 0
            while ($input.Position -lt $input.Length) {
              $remaining = [int64]($input.Length - $input.Position)
              $size = [int][Math]::Min([int64]$chunkSize, $remaining)
              $buffer = New-Object byte[] $size
              $offset = 0
              while ($offset -lt $size) {
                $read = $input.Read($buffer, $offset, $size - $offset)
                if ($read -le 0) { break }
                $offset += $read
              }
              if ($offset -le 0) { break }

              $fileName = 'part-{0:D3}.bin' -f $index
              $chunkPath = Join-Path $versionRoot $fileName
              $output = [System.IO.File]::Create($chunkPath)
              try {
                $output.Write($buffer, 0, $offset)
                $output.Flush()
              } finally {
                $output.Dispose()
              }

              $chunks += [ordered]@{
                name = "versions/$version/$fileName"
                size = [int64]$offset
              }
              $totalChunkBytes += [int64]$offset
              $index += 1
            }
          } finally {
            $input.Dispose()
          }

          if ($totalChunkBytes -ne [int64]$exe.Length) {
            throw "Chunk total $totalChunkBytes does not match installer size $($exe.Length)."
          }
          foreach ($chunk in $chunks) {
            if ([int64]$chunk['size'] -gt 25MB) { throw "Updater chunk exceeds the Storage object limit." }
          }

          $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = $version
            size = [int64]$exe.Length
            sha256 = $hash
            chunks = $chunks
            publishedAt = [DateTimeOffset]::UtcNow.ToString('o')
          }
          $manifestPath = Join-Path $feedRoot 'latest.json'
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path $manifestPath -Encoding utf8NoBOM

          $parsed = Get-Content -Raw -Path $manifestPath | ConvertFrom-Json
          if ($parsed.version -ne $version) { throw "Updater manifest version mismatch." }
          if ($parsed.sha256 -ne $hash) { throw "Updater manifest hash mismatch." }
          if ([int64]$parsed.size -ne [int64]$exe.Length) { throw "Updater manifest size mismatch." }
          if (@($parsed.chunks).Count -lt 1) { throw "Updater manifest contains no chunks." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: userFLEX-Client-Windows
          path: |
            client-app/dist/*.exe
            client-app/dist/update-feed/latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish automatic updater feed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          SUPABASE_URL: https://lbvxnbbglkjnwphaomyx.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SUPABASE_SERVICE_ROLE_KEY) { throw "SUPABASE_SERVICE_ROLE_KEY is required." }

          $version = node -p "require('./package.json').version"
          $feedRoot = Join-Path $PWD 'dist\update-feed'
          $versionRoot = Join-Path $feedRoot "versions\$version"
          $parts = @(Get-ChildItem -Path $versionRoot -Filter 'part-*.bin' | Sort-Object Name)
          if ($parts.Count -lt 1) { throw "No updater chunks were generated." }

          # Publish immutable versioned chunks first. latest.json is uploaded last so
          # clients can never discover a release whose binary parts are incomplete.
          foreach ($file in $parts) {
            $objectName = "versions/$version/$($file.Name)"
            $url = "$env:SUPABASE_URL/storage/v1/object/userflex-client-releases/$objectName"
            Write-Host "Publishing $objectName ($($file.Length) bytes)..."
            & curl.exe --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 300 `
              --request POST $url `
              --header "Authorization: Bearer $env:SUPABASE_SERVICE_ROLE_KEY" `
              --header "apikey: $env:SUPABASE_SERVICE_ROLE_KEY" `
              --header "x-upsert: true" `
              --header "cache-control: max-age=31536000, immutable" `
              --header "Content-Type: application/octet-stream" `
              --data-binary "@$($file.FullName)"
            if ($LASTEXITCODE -ne 0) { throw "Failed to publish $objectName." }
          }

          $manifest = Get-Item -Path (Join-Path $feedRoot 'latest.json')
          $manifestUrl = "$env:SUPABASE_URL/storage/v1/object/userflex-client-releases/latest.json"
          Write-Host "Publishing latest.json last..."
          & curl.exe --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 60 `
            --request POST $manifestUrl `
            --header "Authorization: Bearer $env:SUPABASE_SERVICE_ROLE_KEY" `
            --header "apikey: $env:SUPABASE_SERVICE_ROLE_KEY" `
            --header "x-upsert: true" `
            --header "cache-control: max-age=0" `
            --header "Content-Type: application/json" `
            --data-binary "@$($manifest.FullName)"
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish latest.json." }

          $publicManifestUrl = "$env:SUPABASE_URL/storage/v1/object/public/userflex-client-releases/latest.json?ts=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())"
          $published = Invoke-RestMethod -Uri $publicManifestUrl -Headers @{ 'Cache-Control' = 'no-cache' }
          if ($published.version -ne $version) { throw "Published updater feed does not expose version $version." }
          if (@($published.chunks).Count -ne $parts.Count) { throw "Published updater feed chunk count mismatch." }

          $firstChunk = @($published.chunks)[0]
          $firstChunkUrl = "$env:SUPABASE_URL/storage/v1/object/public/userflex-client-releases/$($firstChunk.name)?v=$version"
          $response = Invoke-WebRequest -Uri $firstChunkUrl -Method Head -UseBasicParsing
          if ($response.StatusCode -ne 200) { throw "Published updater chunk is not publicly readable." }

      - name: Publish Client release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "client-v$version"
          $asset = Get-ChildItem -Path dist -Filter *.exe | Where-Object { $_.Name -notlike '*.__uninstaller.exe' } | Select-Object -First 1
          if (-not $asset) { throw "No Windows installer was generated." }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset.FullName --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset.FullName --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "userFLEX Client v$version" --notes "Instalador de Windows para clientes userFLEX con verificación de versión y actualización automática obligatoria antes del inicio de sesión."
          }
