name: Build userFLEX Client

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'client-app/**'
      - '.github/workflows/build-client-app.yml'
      - 'supabase/migrations/*client_release*'
  push:
    branches: [main]
    paths:
      - 'client-app/**'
      - '.github/workflows/build-client-app.yml'
      - 'supabase/migrations/*client_release*'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    environment: production
    defaults:
      run:
        working-directory: client-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require version bump for desktop code changes
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          git fetch origin $env:GITHUB_BASE_REF --depth=1
          $changed = @(git diff --name-only ("origin/" + $env:GITHUB_BASE_REF) HEAD -- .)
          $meaningful = @($changed | Where-Object {
            $_ -notmatch '^client-app/package\.json$'
          })
          if ($meaningful.Count -gt 0) {
            $basePackage = git show ("origin/" + $env:GITHUB_BASE_REF + ":client-app/package.json") | ConvertFrom-Json
            $currentVersion = node -p "require('./package.json').version"
            if ($currentVersion -eq $basePackage.version) {
              Write-Host 'Desktop files changed:'
              $meaningful | ForEach-Object { Write-Host " - $_" }
              throw 'Desktop code changed without bumping client-app/package.json version.'
            }
          }

      - name: Detect optional production VMP credentials
        id: vmp
        shell: pwsh
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          $hasAccount = -not [string]::IsNullOrWhiteSpace($env:EVS_ACCOUNT_NAME)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:EVS_PASSWD)
          if ($hasAccount -and $hasPassword -and $env:GITHUB_REF -eq 'refs/heads/main' -and $env:GITHUB_EVENT_NAME -ne 'pull_request') {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host 'EVS credentials detected. Production VMP signing will be attempted.'
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Warning 'EVS production credentials are unavailable or this is not a production push. Build and automatic updater publication will continue without production VMP signing.'
          }

      - uses: actions/setup-python@v5
        if: steps.vmp.outputs.enabled == 'true'
        with:
          python-version: '3.12'

      - name: Install CastLabs EVS signing client
        if: steps.vmp.outputs.enabled == 'true'
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check "castlabs-evs==1.3.2"

      - name: Install Client dependencies
        run: npm install

      - name: Validate Client JavaScript
        shell: pwsh
        run: |
          node --check bootstrap.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check main.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check renderer.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check preload.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check browser-renderer.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check browser-preload.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check browser-engine/kaizen-engine.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check browser-engine/credential-policy.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check browser-engine/session-state.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check browser-engine/proxy-relay.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check browser-engine/extension/background.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check browser-engine/extension/content.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check build/vmp-sign.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows installer
        if: github.event_name != 'pull_request'
        env:
          USERFLOW_VMP_REQUIRED: ${{ steps.vmp.outputs.enabled == 'true' && '1' || '0' }}
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_NO_ASK: '1'
        run: npm run dist:win

      - name: Build chunked updater feed
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $exe = Get-ChildItem -Path dist -Filter *.exe | Where-Object { $_.Name -notlike '*.__uninstaller.exe' } | Select-Object -First 1
          if (-not $exe) { throw "No Windows installer was generated." }
          if ($exe.Length -gt 300MB) { throw "Client installer exceeds the supported updater size." }

          $feedRoot = Join-Path $PWD 'dist\update-feed'
          $versionRoot = Join-Path $feedRoot "versions\$version"
          New-Item -ItemType Directory -Path $versionRoot -Force | Out-Null

          $chunkSize = 4MB
          $chunks = @()
          [int64]$totalChunkBytes = 0
          $input = [System.IO.File]::OpenRead($exe.FullName)
          try {
            $index = 0
            while ($input.Position -lt $input.Length) {
              $remaining = [int64]($input.Length - $input.Position)
              $size = [int][Math]::Min([int64]$chunkSize, $remaining)
              $buffer = New-Object byte[] $size
              $offset = 0
              while ($offset -lt $size) {
                $read = $input.Read($buffer, $offset, $size - $offset)
                if ($read -le 0) { break }
                $offset += $read
              }
              if ($offset -le 0) { break }

              $fileName = 'part-{0:D3}.bin' -f $index
              $chunkPath = Join-Path $versionRoot $fileName
              $output = [System.IO.File]::Create($chunkPath)
              try {
                $output.Write($buffer, 0, $offset)
                $output.Flush()
              } finally {
                $output.Dispose()
              }

              $chunks += [ordered]@{
                name = "versions/$version/$fileName"
                size = [int64]$offset
              }
              $totalChunkBytes += [int64]$offset
              $index += 1
            }
          } finally {
            $input.Dispose()
          }

          if ($totalChunkBytes -ne [int64]$exe.Length) {
            throw "Chunk total $totalChunkBytes does not match installer size $($exe.Length)."
          }
          foreach ($chunk in $chunks) {
            if ([int64]$chunk['size'] -gt 25MB) { throw "Updater chunk exceeds the Storage object limit." }
          }

          $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = $version
            size = [int64]$exe.Length
            sha256 = $hash
            chunks = $chunks
            publishedAt = [DateTimeOffset]::UtcNow.ToString('o')
          }
          $manifestPath = Join-Path $feedRoot 'latest.json'
          $versionManifestPath = Join-Path $versionRoot 'manifest.json'
          $manifestJson = $manifest | ConvertTo-Json -Depth 6
          $manifestJson | Set-Content -Path $manifestPath -Encoding utf8NoBOM
          $manifestJson | Set-Content -Path $versionManifestPath -Encoding utf8NoBOM

          $parsed = Get-Content -Raw -Path $manifestPath | ConvertFrom-Json
          if ($parsed.version -ne $version) { throw "Updater manifest version mismatch." }
          if ($parsed.sha256 -ne $hash) { throw "Updater manifest hash mismatch." }
          if ([int64]$parsed.size -ne [int64]$exe.Length) { throw "Updater manifest size mismatch." }
          if (@($parsed.chunks).Count -lt 1) { throw "Updater manifest contains no chunks." }

      - name: Upload installer artifact
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: userFLEX-Client-Windows
          path: |
            client-app/dist/*.exe
            client-app/dist/update-feed/latest.json
          if-no-files-found: error
          retention-days: 1

      - name: Publish automatic updater feed to Cloudflare R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CLOUDFLARE_API_TOKEN) { throw "CLOUDFLARE_API_TOKEN is required for R2 publishing." }
          if (-not $env:CLOUDFLARE_ACCOUNT_ID) { throw "CLOUDFLARE_ACCOUNT_ID is required for R2 publishing." }

          $bucket = 'userflex-client-releases'
          & npx wrangler@4.130.0 r2 bucket info $bucket --json --cwd .. *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating Cloudflare R2 bucket $bucket..."
            & npx wrangler@4.130.0 r2 bucket create $bucket --cwd ..
            if ($LASTEXITCODE -ne 0) { throw "Could not create R2 bucket $bucket." }
          }

          $version = node -p "require('./package.json').version"
          $feedRoot = Join-Path $PWD 'dist\update-feed'
          $versionRoot = Join-Path $feedRoot "versions\$version"
          $parts = @(Get-ChildItem -Path $versionRoot -Filter 'part-*.bin' | Sort-Object Name)
          if ($parts.Count -lt 1) { throw "No updater chunks were generated." }

          foreach ($file in $parts) {
            $objectName = "versions/$version/$($file.Name)"
            Write-Host "Publishing R2 $objectName ($($file.Length) bytes)..."
            & npx wrangler@4.130.0 r2 object put "$bucket/$objectName" --file "$($file.FullName)" --content-type "application/octet-stream" --cache-control "public, max-age=31536000, immutable" --remote --cwd ..
            if ($LASTEXITCODE -ne 0) { throw "Failed to publish R2 object $objectName." }
          }

          $versionManifest = Get-Item -Path (Join-Path $versionRoot 'manifest.json')
          & npx wrangler@4.130.0 r2 object put "$bucket/versions/$version/manifest.json" --file "$($versionManifest.FullName)" --content-type "application/json" --cache-control "public, max-age=31536000, immutable" --remote --cwd ..
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish R2 version manifest." }

          $manifest = Get-Item -Path (Join-Path $feedRoot 'latest.json')
          & npx wrangler@4.130.0 r2 object put "$bucket/latest.json" --file "$($manifest.FullName)" --content-type "application/json" --cache-control "no-store, max-age=0" --remote --cwd ..
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish R2 latest.json." }

          $verifyPath = Join-Path $env:RUNNER_TEMP 'userflex-r2-latest.json'
          if (Test-Path $verifyPath) { Remove-Item $verifyPath -Force }
          & npx wrangler@4.130.0 r2 object get "$bucket/latest.json" --file "$verifyPath" --remote --cwd ..
          if ($LASTEXITCODE -ne 0) { throw "Failed to read R2 latest.json after publish." }
          $published = Get-Content -Raw -Path $verifyPath | ConvertFrom-Json
          if ($published.version -ne $version) { throw "R2 updater feed does not expose version $version." }
          if (@($published.chunks).Count -ne $parts.Count) { throw "R2 updater feed chunk count mismatch." }

      - name: Publish Client release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "client-v$version"
          $asset = Get-ChildItem -Path dist -Filter *.exe | Where-Object { $_.Name -notlike '*.__uninstaller.exe' } | Select-Object -First 1
          if (-not $asset) { throw "No Windows installer was generated." }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset.FullName --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset.FullName --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "userFLEX Client v$version" --notes "Instalador de Windows para clientes userFLEX. userFLOW se actualiza de forma independiente y no instala ni modifica userFLEX Session Manager. La firma VMP de producción se aplica cuando las credenciales EVS están disponibles, pero nunca bloquea la publicación de actualizaciones automáticas."
          }

      - name: Prune old Client updater versions from Cloudflare R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bucket = 'userflex-client-releases'
          $raw = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json
          $clientReleases = @(
            $raw |
              Where-Object { $_.tagName -match '^client-v(\d+\.\d+\.\d+) } |
              ForEach-Object {
                [pscustomobject]@{
                  Tag = $_.tagName
                  Version = [version]$Matches[1]
                  VersionText = $Matches[1]
                }
              } |
              Sort-Object Version -Descending
          )
          $stale = @($clientReleases | Select-Object -Skip 2)

          foreach ($release in $stale) {
            $manifestPath = Join-Path $env:RUNNER_TEMP ("r2-" + $release.VersionText + "-manifest.json")
            if (Test-Path $manifestPath) { Remove-Item $manifestPath -Force }

            & npx wrangler@4.130.0 r2 object get "$bucket/versions/$($release.VersionText)/manifest.json" --file "$manifestPath" --remote --cwd .. *> $null
            if ($LASTEXITCODE -eq 0 -and (Test-Path $manifestPath)) {
              try {
                $manifest = Get-Content -Raw -Path $manifestPath | ConvertFrom-Json
                foreach ($chunk in @($manifest.chunks)) {
                  $chunkName = [string]$chunk.name
                  if ($chunkName -match '^versions/[0-9A-Za-z.-]+/part-\d{3}\.bin) {
                    & npx wrangler@4.130.0 r2 object delete "$bucket/$chunkName" --remote --cwd .. *> $null
                  }
                }
                & npx wrangler@4.130.0 r2 object delete "$bucket/versions/$($release.VersionText)/manifest.json" --remote --cwd .. *> $null
                Write-Host "Removed R2 updater version $($release.VersionText)."
              } catch {
                Write-Warning "Could not parse/delete R2 version $($release.VersionText): $($_.Exception.Message)"
              }
            }
          }

      - name: Keep only two Client GitHub releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json
          $clientReleases = @(
            $raw |
              Where-Object { $_.tagName -match '^client-v(\d+\.\d+\.\d+) } |
              ForEach-Object {
                [pscustomobject]@{
                  Tag = $_.tagName
                  Version = [version]$Matches[1]
                }
              } |
              Sort-Object Version -Descending
          )

          $keep = @($clientReleases | Select-Object -First 2 | ForEach-Object { $_.Tag })
          Write-Host "Keeping Client releases: $($keep -join ', ')"
          foreach ($release in @($clientReleases | Select-Object -Skip 2)) {
            Write-Host "Deleting old Client release $($release.Tag)..."
            gh release delete $release.Tag --cleanup-tag --yes --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete release $($release.Tag)." }
          }
